\* Target = B (resolution to a ref in Bob's own vat), no shortening.
\* Expected: EndToEndFIFO holds.  Calls are received by Bob in chanAB FIFO
\* order and delivered locally to OBJ in that same order.

CONSTANTS
    NumMessages = 3
    TARGET = "B"
    SHORTEN = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT EndToEndFIFO
