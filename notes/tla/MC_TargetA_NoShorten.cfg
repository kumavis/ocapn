\* Target = A (loopback), no shortening.  Expected: EndToEndFIFO holds
\* because every message rides the same A->B->A path and per-channel FIFO
\* preserves order.

CONSTANTS
    NumMessages = 3
    TARGET = "A"
    SHORTEN = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT EndToEndFIFO
