\* Target = B (resolution to a ref in Bob's own vat), shortening admitted.
\* Expected: EndToEndFIFO holds.  Shortening to a ref-on-B doesn't change
\* the wire path (both still go A->B), so per-channel FIFO suffices.  This
\* is Cap'n Proto's / E-on-Java's "same-connection" fast-path.

CONSTANTS
    NumMessages = 3
    TARGET = "B"
    SHORTEN = TRUE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT EndToEndFIFO
